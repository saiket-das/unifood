packages:
  - apps/*
  - packages/*

catalog:
  '@nestjs/common': 12.6.0
  '@nestjs/core': 12.6.0
  '@prisma/adapter-pg': 7.10.1
  '@prisma/client': 7.10.1
  '@types/node': 24.19.2
  '@types/pg': 8.23.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  bullmq: 6.7.8
  ioredis: 6.0.0
  next: 16.4.6
  pg: 8.23.1
  react: 19.3.1
  react-dom: 19.3.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2

engineStrict: true
strictPeerDependencies: true
enableGlobalVirtualStore: false
storeDir: .pnpm-store

allowBuilds:
  '@prisma/engines': true
  # Optional install telemetry is unnecessary for the workspace.
  '@scarf/scarf': false
  # BullMQ's MessagePack dependency can use its portable JavaScript codec.
  msgpackr-extract: false
  prisma: true
  sharp: true
